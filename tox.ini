[tox]
requires =
    tox>=4.2
env_list =
    lint
    py{314, 313, 312, 311, 310}

[testenv]
extras =
    tests
pass_env =
    FORCE_COLOR
commands =
    pytest tests {posargs}
    stravavis --help
    stravavis tests/gpx --activities_path tests/csv
    stravavis tests/tcx --output_prefix strava-tcx

[testenv:lint]
skip_install = true
deps =
    prek
commands =
    prek run --all-files --show-diff-on-failure
